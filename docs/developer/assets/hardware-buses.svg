<text x="80" y="262" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Strings: E1/E0/E3/E4/E6/E7</text>
<text x="80" y="296" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Pitch: left E2 / right E5</text>
<text x="80" y="330" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Strum: left E9 / right E8</text>
<text x="80" y="364" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">IRQ unused; E10/E11 reserved</text>
