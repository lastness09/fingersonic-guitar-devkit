<text x="1125" y="794" dominant-baseline="text-before-edge" fill="#087e65" font-size="27" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">LED ring / native USB</text>
<text x="1125" y="838" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">GPIO48 -&gt; 16 LEDs, GRB</text>
<text x="1125" y="872" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">RMT DMA, async output</text>
<text x="1125" y="906" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">GPIO19 D- / GPIO20 D+</text>
<text x="1125" y="940" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">TinyUSB MIDI device</text>
<polyline points="980,871 1105,871" fill="none" stroke="#087e65" stroke-width="4"/>
<polygon points="1105,871 1092.3937405670624,877.0895174775573 1092.3937405670624,864.9104825224427" fill="#087e65"/>
<text x="60" y="1034" dominant-baseline="text-before-edge" fill="#172c45" font-size="25" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Touch electrodes use MPR121, not ESP32 touchRead(). Electrode and GPIO numbers are separate.</text>
