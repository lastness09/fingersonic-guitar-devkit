<rect x="60" y="485" width="435" height="240" rx="12" fill="#f2f6fa" stroke="#087e65" stroke-width="2"/>
<text x="80" y="499" dominant-baseline="text-before-edge" fill="#087e65" font-size="27" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Battery / charge / power</text>
<text x="80" y="543" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">BAT+ divider -&gt; GPIO1</text>
<text x="80" y="577" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">CHRG -&gt; GPIO2</text>
<text x="80" y="611" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">STDBY -&gt; GPIO4</text>
<text x="80" y="645" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">3.3 V power state -&gt; GPIO8</text>
<text x="80" y="679" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">GPIO8 is input, not power latch</text>
<polyline points="495,601 610,601" fill="none" stroke="#087e65" stroke-width="4"/>
<polygon points="610,601 597.3937405670625,607.0895174775573 597.3937405670625,594.9104825224427" fill="#087e65"/>
