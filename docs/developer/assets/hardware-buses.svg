<text x="80" y="894" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Encoder: A38 / B39 / SW47</text>
<text x="80" y="928" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Switches to GND; internal pullups</text>
<polyline points="495,880 610,880" fill="none" stroke="#526780" stroke-width="4"/>
<polygon points="610,880 597.3937405670625,886.0895174775573 597.3937405670625,873.9104825224427" fill="#526780"/>
<rect x="1105" y="170" width="435" height="240" rx="12" fill="#f2f6fa" stroke="#007fbd" stroke-width="2"/>
