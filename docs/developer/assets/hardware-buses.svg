<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>02  MCU and Peripheral Buses</title><desc>Arrows show signal direction, not PCB routing. MCU logic is 3.3 V; all circuits share ground.</desc><rect width="100%" height="100%" fill="white"/>
<text x="44" y="25" dominant-baseline="text-before-edge" fill="#172c45" font-size="36" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">02  MCU and Peripheral Buses</text>
<text x="44" y="80" dominant-baseline="text-before-edge" fill="#526780" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Arrows show signal direction, not PCB routing. MCU logic is 3.3 V; all circuits share ground.</text>
<rect x="610" y="180" width="370" height="720" rx="12" fill="#f2f6fa" stroke="#172c45" stroke-width="2"/>
<text x="630" y="194" dominant-baseline="text-before-edge" fill="#172c45" font-size="27" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">ESP32-S3</text>
<text x="630" y="238" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Dual core, 240 MHz</text>
<text x="630" y="272" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Flash layout: 16 MiB</text>
<text x="630" y="306" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">PSRAM configuration: OPI</text>
<text x="630" y="340" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif"></text>
<text x="630" y="374" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">I2C SDA11 / SCL12</text>
<text x="630" y="408" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif"></text>
<text x="630" y="442" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">SPI 13 / 14 / 10</text>
<text x="630" y="476" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">DC18 / RST21 / BL9</text>
<text x="630" y="510" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif"></text>
<text x="630" y="544" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">I2S BCLK40 / DOUT41</text>
<text x="630" y="578" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">WS42; no MCLK</text>
<text x="630" y="612" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif"></text>
<text x="630" y="646" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">ADC: 1 / 5 / 6 / 8</text>
<text x="630" y="680" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Digital in: 2 / 4 / 7 / 47</text>
<text x="630" y="714" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Encoder: 38 / 39</text>
<text x="630" y="748" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">LED48; USB19 / 20</text>
<rect x="60" y="170" width="435" height="240" rx="12" fill="#f2f6fa" stroke="#007fbd" stroke-width="2"/>
<text x="80" y="184" dominant-baseline="text-before-edge" fill="#007fbd" font-size="27" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">MPR121</text>
