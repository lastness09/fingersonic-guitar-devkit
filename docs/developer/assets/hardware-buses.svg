<text x="1125" y="604" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">GPIO42 -&gt; LCK/LRCLK</text>
<text x="1125" y="638" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">44100 Hz; 16-bit stereo</text>
<text x="1125" y="672" dominant-baseline="text-before-edge" fill="#172c45" font-size="22" font-family="Segoe UI,Arial,DejaVu Sans,sans-serif">Analog output -&gt; audio circuit</text>
<polyline points="980,580 1105,580" fill="none" stroke="#7054c8" stroke-width="4"/>
<polygon points="1105,580 1092.3937405670624,586.0895174775573 1092.3937405670624,573.9104825224427" fill="#7054c8"/>
